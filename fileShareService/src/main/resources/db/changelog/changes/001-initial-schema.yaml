databaseChangeLog:
  - changeSet:
      id: files-1
      author: file-service
      changes:
        - createTable:
            tableName: files
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: file_name, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: original_file_name, type: VARCHAR(255), constraints: {nullable: false}}
              - column: {name: content_type, type: VARCHAR(100), constraints: {nullable: false}}
              - column: {name: file_size, type: BIGINT, constraints: {nullable: false}}
              - column: {name: user_id, type: BIGINT, constraints: {nullable: false}}
              - column: {name: uploaded_at, type: TIMESTAMP, constraints: {nullable: false}, defaultValueComputed: "CURRENT_TIMESTAMP"}
              - column: {name: updated_at, type: TIMESTAMP, constraints: {nullable: false}, defaultValueComputed: "CURRENT_TIMESTAMP"}

  - changeSet:
      id: files-1.1
      author: file-service
      preConditions:
        onFail: MARK_RAN
        onFailMessage: "Skipping FK - users table not ready yet"
        tableExists:
          tableName: users

      changes:
        - addForeignKeyConstraint:
            baseTableName: files
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_files_user
            onDelete: CASCADE

