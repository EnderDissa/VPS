spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: fileShareService
  config:
    import: 'optional:eureka:,optional:configserver:'
  cloud:
    config:
      uri: http://localhost:9000
      fail-fast: true
      retry:
        initial-interval: 1000
        max-interval: 5000
        multiplier: 1.1
        max-attempts: 10
