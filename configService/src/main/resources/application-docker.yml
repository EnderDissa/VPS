server:
  port: 9000

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        bootstrap: true
        native:
          search-locations: classpath:/docker-configs

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator

  endpoint:
    health:
      show-details: always
